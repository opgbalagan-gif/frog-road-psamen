server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    etag on;
    gzip off;
    gzip_static on;
    add_header X-Content-Type-Options nosniff always;

    location = /health { access_log off; return 200 'ok'; }
    location = /index.html { add_header Cache-Control 'no-cache'; }
    location = /build.json { add_header Cache-Control 'no-cache'; }
    location ~ "^/(engine-|game-|delivery-)[a-f0-9]{12}[.]" {
        add_header Cache-Control 'public, max-age=31536000, immutable';
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    # Explicit .gz URLs are binary archives. The loader decompresses them itself.
    # Do not add Content-Encoding to these paths (that would decompress twice).
    location / { try_files $uri $uri/ =404; }
}
