<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#172c23">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="FROG ROAD × PREACHER SAY AMEN. Тап — прыжок вперёд, свайп — смена направления.">
  <title>FROG ROAD × PREACHER SAY AMEN</title>
  <link rel="icon" href="index.icon.png" type="image/png">
  <style>
    * {box-sizing: border-box}
    html, body {margin: 0; width: 100%; height: 100%; min-height: 100dvh; overflow: hidden; background: #172c23; color: #f6e7bc; overscroll-behavior: none; touch-action: none}
    #canvas {position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none}
    #status {position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background: #172c23; font: 15px/1.5 system-ui, sans-serif; text-align: center; gap: 14px}
    #status[hidden] {display: none}
    #poster {width: min(360px, 85vw, 56vh); height: auto; image-rendering: pixelated}
    #status-progress {width: min(290px, 80vw); height: 12px; accent-color: #dca04a; border: 0}
    #status-text {margin: 0; min-height: 24px; max-width: 360px; font-variant-numeric: tabular-nums}
    #status-hint {margin: 0; max-width: 360px; color: #bac3a8; font-size: 12px}
    #retry {border: 2px solid #80551d; border-radius: 5px; background: #dca04a; color: #231a0b; padding: 12px 22px; font: bold 15px system-ui; cursor: pointer; touch-action: manipulation}
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0">Для игры нужен браузер с поддержкой WebGL 2.</canvas>
  <div id="status" role="status" aria-live="polite">
    <img id="poster" src="loading.png" width="360" height="270" alt="FROG ROAD — PREACHER SAY AMEN">
    <progress id="status-progress" max="100" value="0" aria-label="Загрузка игры"></progress>
    <p id="status-text">Готовим дорогу…</p>
    <p id="status-hint">Тап — прыжок вперёд. Свайп — смена направления.</p>
    <button id="retry" hidden>Попробовать ещё раз</button>
    <noscript>Включите JavaScript, чтобы запустить игру.</noscript>
  </div>
  <script src="delivery-f8e74d8770c3.js"></script>
  <script src="engine-c1d6b7ae4beb.js"></script>
  <script>
    const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"engine-c1d6b7ae4beb","experimentalVK":false,"fileSizes":{"engine-c1d6b7ae4beb.wasm":26078984,"game-7078d09457f7.pck":1772664},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"mainPack":"game-7078d09457f7.pck"};
    const DELIVERY_ASSETS = [{"file":"engine-c1d6b7ae4beb.wasm","gzip":"engine-c1d6b7ae4beb.wasm.gz","size":26078984,"compressedSize":6025983,"sha256":"a05e9fbf5f128fc240ae90426c033b326aebe39a1772bd6e161bdf9bbbb20ffd","type":"application/wasm"},{"file":"game-7078d09457f7.pck","gzip":"game-7078d09457f7.pck.gz","size":1772664,"compressedSize":1667111,"sha256":"7078d09457f7477b4e8a39ffa537fe217277e571756a097869e0c35ffe97e773","type":"application/octet-stream"}];
    const statusOverlay = document.getElementById('status');
    const statusText = document.getElementById('status-text');
    const statusProgress = document.getElementById('status-progress');
    const retryButton = document.getElementById('retry');
    retryButton.addEventListener('click', () => location.reload());
    async function start() {
      try {
        if (typeof Engine === 'undefined' || !globalThis.FrogRoadDelivery) throw new Error('Loader unavailable');
        const missing = Engine.getMissingFeatures({threads: false});
        if (missing.length) {
          statusText.textContent = 'Откройте игру в свежем Chrome, Safari или Firefox.';
          document.getElementById('status-hint').textContent = 'Нужна поддержка: ' + missing.join(', ');
          statusProgress.hidden = true;
          return;
        }
        await FrogRoadDelivery.prepare(DELIVERY_ASSETS, (current, total) => {
          const percent = Math.min(100, Math.round(current / total * 100));
          statusProgress.value = percent * 0.9;
          statusText.textContent = 'Загружаем игру · ' + percent + '%';
        });
        statusProgress.value = 90;
        statusText.textContent = 'Запускаем игру…';
        const engine = new Engine(GODOT_CONFIG);
        await engine.startGame();
        statusOverlay.hidden = true;
        document.documentElement.dataset.gameReady = 'true';
        document.documentElement.dataset.delivery = JSON.stringify({
          ...FrogRoadDelivery.snapshot(), readyMs: Math.round(performance.now())
        });
        FrogRoadDelivery.prune();
      } catch (error) {
        console.error('FROG ROAD startup failed', error);
        statusText.textContent = 'Не удалось загрузить игру. Проверьте соединение и попробуйте ещё раз.';
        statusProgress.hidden = true;
        retryButton.hidden = false;
      }
    }
    document.getElementById('canvas').addEventListener('pointerup', function () {
      if (document.fullscreenEnabled && !document.fullscreenElement) {
        document.documentElement.requestFullscreen({navigationUI: 'hide'}).catch(() => {});
      }
    }, {once: true});
    start();
  </script>
</body>
</html>
